      responses:
        '204':
          $ref: '#/components/responses/SessionRevoked'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /github/installations:
    get:
      operationId: listGithubInstallations
      tags: [GitHubApp]
      summary: List GitHub App installations granted by the authenticated tenant.
      responses:
        '200':
          $ref: '#/components/responses/GithubInstallationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /github/installations/{installationId}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      operationId: getGithubInstallation
      tags: [GitHubApp]
      summary: Get one tenant-owned GitHub App installation with its repository selection.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          $ref: '#/components/responses/GithubInstallation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /github/installations/{installationId}/source:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    post:
      operationId: resolveGithubSource
      tags: [GitHubApp]
      summary: Resolve a repository ref to a normalized clone URL and immutable commit SHA. The short-lived install credential never leaves the server.
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveGithubSourceRequest'
      responses:
        '200':
          $ref: '#/components/responses/GithubSourceResolution'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    sessionCookie:
      type: apiKey
      in: cookie
      name: ocb_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for replay-safe create and destructive mutations.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque tenant-bound pagination cursor from a previous page. MCP tool cursors use the tighter 256-char bound.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SessionIdQuery:
      name: sessionId
      in: query
      required: false
      description: Restrict an account listing to one owned parent session.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChunkIndex:
      name: chunkIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    PreviewId:
      name: previewId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SecretReferenceId:
      name: secretReferenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BillingReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BillingAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Project:
      description: Project resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    ProjectPage:
      description: Opaque cursor page of projects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectPage'
    Environment:
      description: Environment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Environment'
    EnvironmentPage:
      description: Opaque cursor page of environments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvironmentPage'
    Session:
      description: Session resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    SessionPage:
      description: Opaque cursor page of sessions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionPage'
    Operation:
      description: Asynchronous operation resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    OperationPage:
      description: Opaque cursor page of operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationPage'
    Execution:
      description: Execution resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Execution'
    ExecutionEventPage:
      description: Opaque cursor page of execution events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExecutionEventPage'
    ExecutionResult:
      description: Command result, infrastructure failure, or cancellation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExecutionResult'
    SourceManifest:
      description: Source manifest resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceManifest'
    SourceManifestPage:
      description: Opaque cursor page of source manifests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceManifestPage'
    ChunkReceipt:
      description: Bounded source chunk upload receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChunkReceipt'
    SourceVerification:
      description: Verified source checksum result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceVerification'
    Preview:
      description: Preview resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Preview'
    SecretReference:
      description: Workload secret metadata. Values are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecretReference'
      headers:
        Cache-Control:
          description: Sensitive write responses are never cached.
          schema:
            type: string
    SecretReferencePage:
      description: Opaque cursor page of workload secret metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecretReferencePage'
    EnvironmentConfiguration:
      description: Non-secret environment configuration with ordered secret references.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvironmentConfiguration'
    Unauthenticated:
      description: Missing or invalid actor credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Absent, malformed, or cross-owner resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Stable conflict envelope for idempotency and state races.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation or cursor error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Retryable rate limit with Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Retryable infrastructure error with Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds the maximum accepted size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated actor is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error with no internal state exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    WebhookForbidden:
      description: The configured payment environment forbids this webhook, such as disabled live handling.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidGrant:
      description: Expired, replayed, or invalid credential or grant (RFC 6749 style, generic).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidClient:
      description: Client authentication failed for the token endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MagicLinkAccepted:
      description: Deterministic enumeration-safe acceptance envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkAccepted'
    WebSession:
      description: Current web session binding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebSession'
    WebSessionIssued:
      description: New web session issued with Set-Cookie and CSRF token.
      headers:
        Set-Cookie:
          description: "HttpOnly, Secure, Path=/ session cookie; SameSite=Lax by default, SameSite=None in the explicit cross-origin hosting mode."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebSessionIssued'
    WebSessionRenewed:
      description: Rotated web session id with a replacement Set-Cookie header.
      headers:
        Set-Cookie:
          description: "Replacement HttpOnly, Secure, Path=/ session cookie; SameSite=Lax by default, SameSite=None in the explicit cross-origin hosting mode."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebSessionIssued'
    SessionRevoked:
      description: The credential was revoked (or was already absent); no body.
    GithubLoginStart:
      description: Provider redirect target bound to an opaque one-time state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GithubLoginStart'
    CliAuthorizationStart:
      description: Pending CLI authorization with provider redirect URL bound to PKCE and state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CliAuthorizationStart'
    CliTokenPair:
      description: Short-lived audience-bound access credential with rotating hashed refresh family member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CliTokenPair'
    GithubInstallation:
      description: Tenant-owned GitHub App installation metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GithubInstallation'
    GithubInstallationPage:
      description: Opaque cursor page of GitHub App installations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GithubInstallationPage'
    GithubSourceResolution:
      description: Immutable source identity captured server-side; no credential is exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GithubSourceResolution'
    BillingWallet:
      description: Derived wallet projection. No mutable authoritative balance exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingWallet'
    BillingLot:
      description: Traceable expiring credit lot with issue and expiry dates.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingLot'
    BillingLotPage:
      description: Opaque cursor page of credit lots.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingLotPage'
    BillingLedgerPage:
      description: Opaque cursor page of immutable ledger entries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingLedgerPage'
    BillingReservation:
      description: Atomic credit reservation with settlement checkpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingReservation'
    BillingSettlement:
      description: One-minute settlement checkpoint with refill status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingSettlement'
    BillingUsage:
      description: Immutable attributed usage event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingUsage'
    BillingUsagePage:
      description: Opaque cursor page of owner-scoped usage attribution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingUsagePage'
    BillingRateCardPage:
      description: Opaque cursor page of versioned rate cards.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingRateCardPage'
    BillingReconciliation:
      description: Ledger reconstruction with quarantine and alert status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingReconciliation'
    BillingCheckout:
      description: Opaque server-priced checkout attempt. Polling never grants credits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingCheckout'
    DodoWebhookAck:
      description: Verified webhook acknowledgement with safe duplicate replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DodoWebhookAck'
    PaymentReconciliation:
      description: Polling repair summary for unresolved Dodo attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentReconciliation'
  schemas:
    SafeError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retryAfterSeconds:
          type: integer
          minimum: 0
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          $ref: '#/components/schemas/SafeError'
        requestId:
          type: string
          minLength: 1
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile:
      type: object
      additionalProperties: false
      required: [id, createdAt, updatedAt, userId, displayName]
      properties:
        id:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Sandbox:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, projectId, normalizedState, rawState, providerKind, reconciliationStatus]
      properties:
        id:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        normalizedState:
          type: string
          enum:
            [creating, deleting, deleted, error, paused, pausing, running, stopping, stopped, unknown]
        rawState:
          type: string
          minLength: 1
        providerKind:
          type: string
          minLength: 1
        reconciliationStatus:
          type: string
          enum: [error, fresh, pending, stale]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretReference:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, projectId, environmentId, name, provider, exposureMode, allowedHosts, status, version]
      properties:
        id:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        environmentId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          type: string
          minLength: 1
          maxLength: 64
        exposureMode:
          type: string
          enum: [process, host]
        allowedHosts:
          type: array
          items:
            type: string
            minLength: 1
        status:
          type: string
          enum: [active, delete_pending, deleted, failed]
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SandboxBinding:
      type: object
      additionalProperties: false
      required: [ordinal, role, active, state, sandboxId, boundAt, releasedAt]
      properties:
        ordinal:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [primary]
        active:
          type: boolean
        state:
          type: string
          enum: [running, stopped]
        sandboxId:
          type: string
          minLength: 1
        boundAt:
          type: string
          format: date-time
        releasedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    Project:
      type: object
      additionalProperties: false
      required: [id, createdAt, updatedAt, name]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 200
    Environment:
      type: object
      additionalProperties: false
      required: [id, createdAt, updatedAt, projectId, name, selected]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        selected:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, projectId, requestedSpec, effectiveSpec, normalizedState, rawState, sandboxes, primarySandboxId]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          minLength: 1
        requestedSpec:
          type: object
        effectiveSpec:
          type: object
        normalizedState:
          type: string
          enum:
            [created, starting, running, pausing, paused, stopping, stopped, destroying, destroyed]
        rawState:
          type: string
          minLength: 1
        sandboxes:
          type: array
          items:
            $ref: '#/components/schemas/SandboxBinding'
        primarySandboxId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
    ResourceLink:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [project, environment, session, execution, sourceManifest, preview]
        id:
          type: string
          minLength: 1
    Operation:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, kind, projectId, sessionId, state, progress, requestId, error, resource]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        kind:
          type: string
          minLength: 1
          maxLength: 64
        projectId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        sessionId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        state:
          type: string
          enum: [pending, running, succeeded, cancelled, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        error:
          oneOf:
            - $ref: '#/components/schemas/SafeError'
            - type: 'null'
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceLink'
            - type: 'null'
    Execution:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, sessionId, sandboxId, state, command, exitCode, failureKind, failure, truncated, outputBytes, outputLimitBytes]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sessionId:
          type: string
          minLength: 1
        sandboxId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        state:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        command:
          type: string
          minLength: 1
          maxLength: 8192
        exitCode:
          oneOf:
            - type: integer
            - type: 'null'
        failureKind:
          oneOf:
            - type: string
              enum: [command, infrastructure]
            - type: 'null'
        failure:
          oneOf:
            - $ref: '#/components/schemas/SafeError'
            - type: 'null'
        truncated:
          type: boolean
        outputBytes:
          type: integer
          minimum: 0
        outputLimitBytes:
          type: integer
          minimum: 1
    ExecutionEvent:
      type: object
      additionalProperties: false
      required: [sequence, at, kind, stream, message]
      properties:
        sequence:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [started, stdout, stderr, progress, completed, failed, cancelled]
        stream:
          oneOf:
            - type: string
              enum: [stdout, stderr]
            - type: 'null'
        message:
          type: string
          maxLength: 8192
    CommandResult:
      type: object
      additionalProperties: false
      required: [kind, exitCode, stdout, stderr, truncated, outputBytes, outputLimitBytes]
      properties:
        kind:
          type: string
          enum: [command]
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        truncated:
          type: boolean
        outputBytes:
          type: integer
          minimum: 0
        outputLimitBytes:
          type: integer
          minimum: 1
    InfrastructureResult:
      type: object
      additionalProperties: false
      required: [kind, error]
      properties:
        kind:
          type: string
          enum: [infrastructure]
        error:
          $ref: '#/components/schemas/SafeError'
    CancelledResult:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [cancelled]
    ExecutionResult:
      oneOf:
        - $ref: '#/components/schemas/CommandResult'
        - $ref: '#/components/schemas/InfrastructureResult'
        - $ref: '#/components/schemas/CancelledResult'
    SourceManifest:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, updatedAt, sessionId, checksum, chunkCount, totalBytes, uploadedChunks, verified]
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sessionId:
          type: string
          minLength: 1
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        chunkCount:
          type: integer
          minimum: 1
          maximum: 10000
        totalBytes:
          type: integer
          minimum: 1
          maximum: 536870912
        uploadedChunks:
          type: integer
          minimum: 0
        verified:
