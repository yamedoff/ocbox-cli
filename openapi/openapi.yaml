      operationId: consumeMagicLink
      x-idempotency: none
      tags: [Auth]
      summary: Consume a magic-link token and establish a web session. Single use and expiry bound.
      description: 'Requires the ocb_login_bind cookie issued by /auth/magic-links to match the digest persisted with the token, in addition to the single-use token and expiry checks. Cross-site requests are refused and the binding cookie is cleared on success.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeMagicLinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebSessionIssued'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '422':
          $ref: '#/components/responses/ValidationError'
