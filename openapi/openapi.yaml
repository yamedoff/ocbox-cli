    StartCliAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [clientId, redirectUri, codeChallenge, codeChallengeMethod, audience, scope, state]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
        redirectUri:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^http://127\.0\.0\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])/callback$'
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        codeChallengeMethod:
          type: string
          enum: [S256]
        audience:
          type: string
          enum: [cli, mcp]
        scope:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[a-z0-9._:-]+(?: [a-z0-9._:-]+)*$'
        state:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        consent:
          type: object
          additionalProperties: false
          required: [consentId, approve]
          properties:
            consentId:
              type: string
              minLength: 16
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
            approve:
              type: boolean
              enum: [true]
    CliAuthorizationStart:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, consentId, clientId, audience, scopes]
          properties:
            status:
              type: string
              enum: [consent_required]
            consentId:
              type: string
              minLength: 16
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
            clientId:
              type: string
              minLength: 1
              maxLength: 128
            audience:
              type: string
              enum: [cli, mcp]
            scopes:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
        - type: object
          additionalProperties: false
          required: [status, redirectUri, expiresAt]
          properties:
            status:
              type: string
              enum: [authorized]
            redirectUri:
              type: string
              minLength: 16
              maxLength: 512
              format: uri
            expiresAt:
              type: string
              format: date-time
    CliTokenRequest:
      type: object
      additionalProperties: false
      required: [clientId, grantType]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          minLength: 32
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
        redirectUri:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^http://127\.0\.0\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])/callback$'
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
      anyOf:
        - type: object
          required: [code, redirectUri, codeVerifier]
        - type: object
          required: [refreshToken]
