          description: Server-derived billability. Always true for hosted `managed` usage.
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        unit:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        ingestedAt:
          type: string
          format: date-time
        providerReportId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        sessionId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
    BillingUsagePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingUsage'
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    IngestBillingUsageRequest:
      type: object
      additionalProperties: false
      required: [eventId, billingMode, quantity, unit, source, windowStart, windowEnd]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
        billingMode:
          type: string
          enum: [managed, byok]
          description: Accepted but ignored. The server always ingests as `managed`/billable; send `managed`, and never rely on a `byok` body to change billability.
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        unit:
          type: string
          minLength: 1
          maxLength: 32
        source:
          type: string
          minLength: 1
          maxLength: 64
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        providerReportId:
          type: string
          minLength: 1
          maxLength: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 36
    BillingRateCard:
      type: object
      additionalProperties: false
      required: [version, kind, effectiveFrom, enabled, fixture, microcreditsPerMinute]
      properties:
        version:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        effectiveFrom:
          type: string
          format: date-time
        enabled:
          type: boolean
        fixture:
          type: boolean
        microcreditsPerMinute:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
    BillingRateCardPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingRateCard'
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    BillingReconciliation:
      type: object
      additionalProperties: false
      required: [ownerId, quarantined, mismatches, reconciledAt]
      properties:
        ownerId:
          type: string
          minLength: 1
        quarantined:
          type: boolean
        mismatches:
          type: array
          items:
            type: string
        alert:
          oneOf:
            - type: string
            - type: 'null'
        reconciledAt:
          type: string
          format: date-time
    CreateBillingCheckoutRequest:
      type: object
      additionalProperties: false
      required: [credits]
      properties:
        credits:
