openapi: 3.1.0
info:
  title: OpenCloudBox hosted API
  version: 0.1.0
  description: Runtime-neutral v1 contract. Every unsafe method requires an Idempotency-Key header.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Environments
  - name: Sessions
  - name: Operations
  - name: Executions
  - name: Source
  - name: Previews
  - name: Auth
  - name: CLIAuth
  - name: GitHubApp
x-error-codes:
  INVALID_REQUEST: 400
  UNAUTHENTICATED: 401
  FORBIDDEN: 403
  NOT_FOUND: 404
  METHOD_NOT_ALLOWED: 405
  IDEMPOTENCY_CONFLICT: 409
  IDEMPOTENCY_IN_PROGRESS: 409
  OPERATION_NOT_CANCELLABLE: 409
  SESSION_STATE_CONFLICT: 409
  EXECUTION_NOT_CANCELLABLE: 409
  EXECUTION_NOT_COMPLETE: 409
  SOURCE_CHUNK_CONFLICT: 409
  VALIDATION_ERROR: 422
  INVALID_CURSOR: 422
  IDEMPOTENCY_KEY_REQUIRED: 422
  SOURCE_INCOMPLETE: 422
  SOURCE_INTEGRITY_FAILED: 422
  SOURCE_LIMIT_EXCEEDED: 422
  PAYLOAD_TOO_LARGE: 413
  RATE_LIMITED: 429
  SERVICE_UNAVAILABLE: 503
  INTERNAL_ERROR: 500
  INVALID_CLIENT: 401
  CSRF_TOKEN_INVALID: 403
  INVALID_GRANT: 400
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List owner projects with an opaque cursor.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /projects/{projectId}:
