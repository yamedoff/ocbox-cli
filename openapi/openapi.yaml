          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        currency:
          type: string
          minLength: 1
        catalogVersion:
          type: string
          minLength: 1
        status:
          type: string
          enum: [created, pending, paid, failed, cancelled, verification_required, partially_refunded, refunded, disputed]
        providerPaymentId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        checkoutUrl:
          oneOf:
