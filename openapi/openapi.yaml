openapi: 3.1.0
info:
  title: OpenCloudBox hosted API
  version: 0.1.0
  description: Runtime-neutral v1 contract. Every unsafe method requires an Idempotency-Key header, except operations marked `x-idempotency: none` (auth, CLI/GitHub protocol, webhook, and source-resolve operations with their own single-use semantics).
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Environments
  - name: Sessions
  - name: Operations
  - name: Executions
  - name: Source
  - name: Previews
  - name: Secrets
  - name: Auth
  - name: CLIAuth
  - name: GitHubApp
  - name: Billing
x-error-codes:
  ACCOUNT_HOLD: 409
  CSRF_TOKEN_INVALID: 403
  DODO_LIVE_DISABLED: 403
  DODO_SIGNATURE_INVALID: 401
  EXECUTION_NOT_CANCELLABLE: 409
  EXECUTION_NOT_COMPLETE: 409
  FORBIDDEN: 403
  IDEMPOTENCY_CONFLICT: 409
  IDEMPOTENCY_IN_PROGRESS: 409
  IDEMPOTENCY_KEY_REQUIRED: 422
  INSUFFICIENT_CREDITS: 409
  INTERNAL_ERROR: 500
  INVALID_CLIENT: 401
  INVALID_CURSOR: 422
  INVALID_GRANT: 400
  INVALID_REQUEST: 400
  METHOD_NOT_ALLOWED: 405
  NOT_FOUND: 404
  OPERATION_NOT_CANCELLABLE: 409
  PAYLOAD_TOO_LARGE: 413
  PAYMENT_CONFLICT: 409
  PAYMENT_VERIFICATION_REQUIRED: 409
  RATE_CARD_DISABLED: 409
  RATE_LIMITED: 429
  SERVICE_UNAVAILABLE: 503
  SESSION_STATE_CONFLICT: 409
  SOURCE_CHUNK_CONFLICT: 409
  SOURCE_INCOMPLETE: 422
  SOURCE_INTEGRITY_FAILED: 422
  SOURCE_LIMIT_EXCEEDED: 422
  UNAUTHENTICATED: 401
  VALIDATION_ERROR: 422
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List owner projects with an opaque cursor.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get an owner project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update project metadata.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Destroy a project asynchronously.
      description: Accepts an optional confirmation body. `confirmInUse: true` acknowledges deletion while live sessions still reference the scope.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConfirmationRequest'
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
