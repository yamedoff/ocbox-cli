name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: true
      COREPACK_ENABLE_STRICT: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Install exact Corepack
        # Windows runners include package-manager shims; the ephemeral toolcache
        # must replace them so the verified Corepack version is deterministic.
        run: npm install --global corepack@0.36.0 --force
      - name: Prefer exact Corepack shims on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # setup-node precedes npm's global prefix on Windows by default.
        run: (npm prefix --global) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Verify toolchain
        run: node scripts/verify-toolchain.mjs
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Run unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Smoke-test CLI shell
        run: pnpm run cli:smoke
