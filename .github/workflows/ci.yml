name: CI

on:
  pull_request:
    # Recovery slices need the same validation before integration into main.
    branches: [main, codex/recovery-cli-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.20.0
          - os: windows-latest
            node: 24.20.0
          - os: ubuntu-latest
            node: 22
    env:
      CI: true
      COREPACK_ENABLE_STRICT: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Install exact Corepack
        # Windows runners include package-manager shims; the ephemeral toolcache
        # must replace them so the verified Corepack version is deterministic.
        run: npm install --global corepack@0.36.0 --force
      - name: Prefer exact Corepack shims on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # setup-node precedes npm's global prefix on Windows by default.
        run: (npm prefix --global) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Verify toolchain
        run: node scripts/verify-toolchain.mjs
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify pinned OpenAPI contract
        run: pnpm run api:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Run unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Smoke-test CLI shell
        run: pnpm run cli:smoke
      - name: Set up Node.js 22 for runtime compatibility tests
        if: matrix.node == 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: false
      - name: Test Node.js 22 runtime
        if: matrix.node == 22
        # Keep the contributor pin; bypass it only for compatibility checks.
        run: |
          pnpm --config.runtimeOnFail=ignore run test:unit
          pnpm --config.runtimeOnFail=ignore run test:cli

  package:
    name: Install npm tarball (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up contributor Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Activate exact pnpm
        run: |
          npm install --global corepack@0.36.0 --force
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Set up runtime Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install tarball and smoke-test CLI
        working-directory: ${{ runner.temp }}
        run: |
          prefix=$(mktemp -d)
          npm i -g --prefix "$prefix" ./opencloudbox-*.tgz
          "$prefix/bin/ocbox" --version
          "$prefix/bin/ocbox" --help
          "$prefix/bin/opencloudbox" --version
          auth_root=$(mktemp -d)
          XDG_CONFIG_HOME="$auth_root/config" XDG_STATE_HOME="$auth_root/state" \
            "$prefix/bin/ocbox" auth status | grep -Fx 'Not logged in'
