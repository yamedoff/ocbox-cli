name: Base image candidate

on:
  pull_request:
    branches: [main]
    paths:
      - images/ocbox-base/**
      - scripts/verify-image-candidate.mjs
      - src/execution/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/image.yml
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build, inspect and scan linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDX_METADATA_PROVENANCE: max
      COREPACK_ENABLE_STRICT: 1
      IMAGE_REF: ocbox-base:candidate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: docker-container
      - name: Install exact Corepack
        run: npm install --global corepack@0.36.0 --force
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install and build the T5 helper
        run: |
          node scripts/verify-toolchain.mjs
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/execution-helper.js
      - name: Verify source and registry pins
        run: node scripts/verify-image-candidate.mjs --registry
      - name: Build loadable runtime candidate
        run: |
          mkdir -p artifacts
          docker buildx build \
            --platform linux/amd64 \
            --file images/ocbox-base/Dockerfile \
            --tag "$IMAGE_REF" \
            --load \
            --provenance=false \
            --metadata-file runtime-build-metadata.json \
            .
          jq -e '."containerimage.config.digest" | test("^sha256:[0-9a-f]{64}$")' runtime-build-metadata.json
      - name: Export attested OCI candidate
        run: |
          mkdir -p artifacts
          docker buildx build \
            --platform linux/amd64 \
            --file images/ocbox-base/Dockerfile \
            --tag "$IMAGE_REF" \
            --provenance=mode=max \
            --metadata-file build-metadata.json \
            --output type=oci,dest=artifacts/ocbox-base.oci.tar \
            .
          jq -e '."containerimage.digest" | test("^sha256:[0-9a-f]{64}$")' build-metadata.json
          test "$(jq -r '."containerimage.config.digest"' runtime-build-metadata.json)" = \
            "$(jq -r '."containerimage.config.digest"' build-metadata.json)"
          jq '."buildx.build.provenance"' build-metadata.json > artifacts/provenance.json
          jq --arg digest "$(jq -r '."containerimage.digest"' build-metadata.json)" \
            '.image.digest = $digest' images/ocbox-base/manifest.json > artifacts/image-manifest.json
      - name: Run readiness and image policy checks
        run: |
          docker run --rm --network=bridge "$IMAGE_REF" /opt/ocbox/bin/readiness.sh
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Config.WorkingDir}}')" = '/workspace'
          ! docker history --no-trunc "$IMAGE_REF" | grep -E '(AKIA[A-Z0-9]{12,}|gh[pousr]_[A-Za-z0-9]{8,}|sk-[A-Za-z0-9_-]{8,})'
      - name: Generate SPDX SBOM from final image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          upload-artifact: false
      - name: Scan final image for critical vulnerabilities and credentials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          scanners: vuln,secret
          ignore-unfixed: false
      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocbox-base-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  attest-and-sign:
    name: Keyless candidate attestation dry run
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocbox-base-${{ github.sha }}
          path: artifacts
      - name: Attest the exact OCI archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/ocbox-base.oci.tar
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify candidate evidence without a long-lived key
        run: |
          cosign sign-blob --yes --bundle artifacts/ocbox-base.bundle.json artifacts/ocbox-base.oci.tar
          cosign verify-blob \
            --bundle artifacts/ocbox-base.bundle.json \
            --certificate-identity-regexp '^https://github.com/yamedoff/ocbox-cli/.github/workflows/image.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            artifacts/ocbox-base.oci.tar
