name: Publish release

on:
  # CONTRIBUTING.md requires all three OS smoke jobs to pass before publishing.
  # Chaining off the smoke workflow makes the publish wait for that whole run
  # instead of racing it on the same tag push.
  workflow_run:
    workflows: ["Release staging smoke"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      COREPACK_ENABLE_STRICT: 1
    steps:
      - name: Check out the smoke-tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Install exact Corepack
        run: npm install --global corepack@0.36.0 --force
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Resolve the release tag
        id: tag
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag=''
          case "$HEAD_BRANCH" in
            v*)
              if git rev-parse --verify --quiet "refs/tags/$HEAD_BRANCH" >/dev/null; then
                tag="$HEAD_BRANCH"
              fi
              ;;
          esac
          if [ -z "$tag" ]; then
            tags=$(git tag --points-at "$HEAD_SHA" --list 'v*')
            count=$(printf '%s\n' "$tags" | grep -c . || true)
            if [ "$count" -gt 1 ]; then
              echo "::error::More than one v* tag points at $HEAD_SHA: $tags"
              exit 1
            fi
            tag=$(printf '%s\n' "$tags" | head -n 1)
          fi
          if [ -z "$tag" ]; then
            echo "::notice::No v* release tag points at $HEAD_SHA; nothing to publish."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $HEAD_SHA."
      - name: Require the tag to match package.json
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version v$version."
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches package.json version $version."
      - name: Install dependencies from lockfile
        if: steps.tag.outputs.tag != ''
        run: pnpm install --frozen-lockfile
      - name: Build and pack the release files
        if: steps.tag.outputs.tag != ''
        run: pnpm run pack:release
      - name: Check the release files
        if: steps.tag.outputs.tag != ''
        shell: bash
        run: |
          release_dir=dist/release
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          tarball="$release_dir/ocbox-${version}.tgz"
          sums="$release_dir/SHA256SUMS"
          latest="$release_dir/LATEST"
          for asset in "$tarball" "$sums" "$latest"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing release file $asset."
              exit 1
            fi
          done
          # BSD find (macOS) lacks max-depth, so count direct files with -path.
          file_count=$(find "$release_dir" -type f ! -path "$release_dir/*/*" | wc -l | tr -d '[:space:]')
          if [ "$file_count" -ne 3 ]; then
            echo "::error::Expected exactly 3 release files in $release_dir, found $file_count."
            exit 1
          fi
          expected=$(awk -v asset="ocbox-${version}.tgz" '{ name = $2; sub(/^\*/, "", name); if (name == asset) print $1 }' "$sums")
          if [ -z "$expected" ]; then
            echo "::error::$sums does not list ocbox-${version}.tgz."
            exit 1
          fi
          # macOS ships shasum, not sha256sum; match install.sh's fallback order.
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$tarball" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$tarball" | awk '{ print $1 }')
          elif command -v openssl >/dev/null 2>&1; then
            actual=$(openssl dgst -sha256 "$tarball" | awk '{ print $NF }')
          else
            echo "::error::No SHA-256 tool was found (sha256sum, shasum, or openssl)."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Checksum mismatch for $tarball."
            exit 1
          fi
          if ! grep -qxF "$version" "$latest"; then
            echo "::error::$latest does not contain $version."
            exit 1
          fi
          echo "Release files for $version are complete and verified."
      - name: Publish the GitHub release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          release_dir=dist/release
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          tarball="$release_dir/ocbox-${version}.tgz"
          sums="$release_dir/SHA256SUMS"
          latest="$release_dir/LATEST"
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag "$tarball" "$sums" "$latest"
